name: GitHub Profile Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          user: Pranesh0805-S
          token: ${{ secrets.METRICS_TOKEN }}

          filename: metrics.svg

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Let the workflow publish both generated SVGs in one commit.
          output_action: none

      - name: Copy isometric calendar into the repository
        run: cp /metrics_renders/metrics.svg ./metrics.svg

      - name: Render animated contribution summary
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/render_profile_cards.py

      - name: Commit profile visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg cards/activity.svg
          if git diff --cached --quiet; then
            echo "Profile visuals are already up to date."
          else
            git commit -m "chore: refresh profile visuals [skip ci]"
            git push
          fi

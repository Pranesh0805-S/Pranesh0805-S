<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="170" viewBox="0 0 1120 170" role="img" aria-labelledby="t"><title id="t">An engineering loop — build, test, learn, repeat</title><defs><linearGradient id="g" x2="1" y2="0"><stop stop-color="#0c1828"/><stop offset=".5" stop-color="#14243d"/><stop offset="1" stop-color="#1b1d3b"/></linearGradient><linearGradient id="a" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><rect width="1120" height="170" rx="18" fill="url(#g)" stroke="#334155"/><text x="30" y="40" fill="#e2e8f0" font-family="Arial" font-weight="700" font-size="21">The engineering loop</text><text x="30" y="63" fill="#94a3b8" font-family="Arial" font-size="13">A process, not a scorecard: keep building, validating, and improving.</text><path d="M82 112H1038" stroke="#475569" stroke-width="2" stroke-dasharray="5 8"/><path d="M82 112H1038" stroke="url(#a)" stroke-width="2" stroke-dasharray="120 836"><animate attributeName="stroke-dashoffset" values="0;-956" dur="7s" repeatCount="indefinite"/></path><g font-family="Arial" font-size="13" font-weight="600" text-anchor="middle"><g><circle cx="130" cy="112" r="13" fill="#0f3148" stroke="#38bdf8" stroke-width="2"><animate attributeName="r" values="11;15;11" dur="2.8s" repeatCount="indefinite"/></circle><text x="130" y="145" fill="#bae6fd">BUILD</text></g><g><circle cx="410" cy="112" r="13" fill="#24234d" stroke="#818cf8" stroke-width="2"/><text x="410" y="145" fill="#c7d2fe">TEST</text></g><g><circle cx="690" cy="112" r="13" fill="#302044" stroke="#c084fc" stroke-width="2"/><text x="690" y="145" fill="#e9d5ff">LEARN</text></g><g><circle cx="970" cy="112" r="13" fill="#123b32" stroke="#34d399" stroke-width="2"/><text x="970" y="145" fill="#a7f3d0">REPEAT</text></g></g><circle cx="82" cy="112" r="3" fill="#38bdf8"/><circle cx="1038" cy="112" r="3" fill="#c084fc"/></svg>